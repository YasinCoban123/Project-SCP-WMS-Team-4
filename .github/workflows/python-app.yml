name: Python application

on:
  push:
    branches: ["main", "CiCD"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt
      - name: Scan Python code with Bandit
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r main.py check_field_types.py models providers processors -ll
      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Tests (nog niet actief)
        run: echo "Tests worden nog niet uitgevoerd"
