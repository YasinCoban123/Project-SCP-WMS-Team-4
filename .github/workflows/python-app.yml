name: Python application

on:
  push:
    branches: [ "main", "CiCD" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      continue-on-error: true
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Start API server
      run: |
        nohup python main.py > server.log 2>&1 &
        for i in $(seq 1 15); do
          curl -s -o /dev/null http://localhost:3000/ && break
          sleep 1
        done
    - name: Test with pytest
      env:
        APIKey: f4a5c6i7l8i9t0y1m2a3n4a5g6
      run: pytest -v --cov --cov-report term --cov-report xml:coverage.xml
    - name: Coverage summary
      run: coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
    - name: Show server log
      if: failure()
      run: cat server.log
    - name: Store coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.xml
      if: always()