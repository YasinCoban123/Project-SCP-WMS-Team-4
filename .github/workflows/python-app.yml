name: Python application

on:
  push:
    branches: ["main", "CiCD"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        continue-on-error: true
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Scan Python code with Bandit
        run: |
          python -m pip install bandit==1.9.4
          python -m bandit -r main.py check_field_types.py models providers processors -ll

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Start API
        run: python -u main.py > server.log 2>&1 &

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --silent --output /dev/null --max-time 2 http://127.0.0.1:3000/api/v1/orders; then
              echo "API is responding"
              exit 0
            fi
            sleep 1
          done

          echo "API did not start"
          cat server.log
          exit 1

      # Pytest mag hier niet zelf de job laten falen: de 80%-check hieronder beslist.
      - name: Run integration tests
        timeout-minutes: 10
        run: python -m pytest test/integration -v --junitxml=report.xml || true

      - name: Check pass rate (minimum 80%)
        run: python test/check_pass_rate.py report.xml 80

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: |
            report.xml
            server.log
